[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feynagent"
version = "0.1.0"
description = "Rules-first tree-level diagram tooling for HEP phenomenology."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4",
  "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

